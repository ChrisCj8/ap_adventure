apadventure.editor.runspd.label=Run Speed
apadventure.editor.runspd.help=The players normal movement speed in units per second. Actually referred to as "WalkSpeed" in gMods code.
apadventure.editor.sprintspd.label=Sprint Speed
apadventure.editor.sprintspd.help=The players movement speed while holding down the sprint button (shift by default) in units per second. Actually referred to as "RunSpeed" in gMods code.
apadventure.editor.jump.label=Jump Power
