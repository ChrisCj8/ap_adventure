apadventure.require.help.intro=This window lets you check if all required content for your run is installed properly.\nYou need to request the requirement information by clicking "(Re-)Request requirement info from server" to get the information from the server before you can see anything in here.
apadventure.require.help.game.intro=The "Games"-section shows you if all games needed for your run are mounted. This only recognizes games mounted through the "Games"-selector in the main menu though, so games through mounted through mount.cfg, which can be used to mount games that aren't officially supported by GMod and is the only way to mount games on a server, may not display as installed.
apadventure.require.help.addon.intro=The "Addons"-section shows you if you have downloaded and activated all addons needed for your run. It also lets you create a preset which you can paste into GMods "Addons"-menu to quickly download and enable all required addons.
apadventure.require.help.addon.select=The tick and cross icons next to the addon list can be clicked to select which items will be included in your preset in case you have installed some of the required addons manually or don't want to download them for some other reason.
apadventure.require.help.addon.preset=Once you have selected all addons you want (you should most likely just get everything unless you know what you're doing or think one of the required addons is not safe to use), you can generate a preset by clicking the "Create Addon Preset"-button.\nThis will add some json text to your clipboard.
apadventure.require.help.addon.usepreset=When you have the preset, open the Main Menu and open the "Addons"-menu.\nAfter that, click the wrench icon in the bottom right corner of your screen. This should open a small menu at the bottom of the addon list.\nClick on the "Import Preset"-button in this menu. Paste the json text you got from clicking "Create Addon Preset" earlier into the upper text box.\nAdd a name for the new preset (the actual name is not important, you'll probably want to delete this preset once you've finished your run) and set your preset to either disable all addons not in the preset or do nothing, depending on if you have any extra addons that you want to run alongside the requirements, like huds or playermodels.\nThe preset won't be loaded automatically after importing it, so you'll have to use the "Load Preset"-Option to load it after.
apadventure.require.help.addon.presetload=The new addons will be loaded the next time you change maps, so if you're not encountering any issues on your current map it's safe to just go to another map through a transition, you do not need to "restart" the gamemode for the addons to load.
apadventure.require.help.other.intro=The "Other Requirements"-section is used to inform you about other requirements that don't fit into the other sections, such as mounts, roms or binary modules.

