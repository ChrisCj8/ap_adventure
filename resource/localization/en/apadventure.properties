apadventure.editor.grav.label=Gravity
apadventure.editor.frctn.label=Player Friction
apadventure.editor.accel.label=Player Acceleration
apadventure.editor.accel.help=What sv_accelerate should be set to when the config is loaded. This value controls how quickly players will gain speed when they start pushing their movement keys while on the ground.
apadventure.editor.airaccel.label=Player Air Acceleration
apadventure.editor.airaccel.help=What sv_airacceleration should be set to when the config is loaded. This value controls how much speed players can gain from Air Strafing. BHop and Surf maps usually expect this value to be higher than normal.
apadventure.editor.stopspd.label=Player Stop Speed
apadventure.editor.hev.label=Enable HL2 HEV Suit functionality (Energy drain from sprinting, using flashlight, etc.)
apadventure.editor.respawn.label=Do not reset map after player death and allow immediate respawning
apadventure.editor.respawn.help=Normally, when a player dies, they will have to wait until all players have died, which will reload the config and respawn all players. This setting allows players to respawn immediately, as many times as they want, as if they were playing sandbox.
apadventure.editor.godmode.label=Disable damage to players
apadventure.editor.godmode.help=Prevents players from taking damage from most sources, they may still die or lose HP to things that set their health to a certain value or kill them directly without dealing damage, such as killbinds, similar to the sbox_godmode cvar in sandbox.
apadventure.editor.requirements.help=Requirement tags are used to let players check if they have installed and mounted all content that they need to play your config. \n\nRequirements defined in the map settings are added on top of the ones added by the group rather than overwriting them.\n\nThe generic game tags can only detect games that have been mounted through the ingame mount selector, and the generic addon tags can only detect workshop addons, so there are also a few custom tags that have been defined through Lua to detect manually installed addons, games mounted through mount.cfg and other miscellaneous requirements, like binary modules or roms. Some common addons will automatically be converted to use these special tags if added through the "Add Workshop Item"-menu.\n\nEntries in the tag list and "Add Workshop Item"-menu can be right-clicked for some extra functionality.\n\nLua coders can also add custom tags in the lua/apadventure/require/ directory.

