apadventure.node.shared.help=Help
apadventure.node.shared.iname=Item Name
apadventure.node.shared.icount=Item Count

apadventure.node.mapitem.helpbase=This node checks how many of a certain Map Item the player has. Map Items can be created in the Map Item Tab, but you currently can't make them actually do anything without a config script or by placing apAdventures map entities in Hammer, so this won't be of much use to you unless you're a coder or mapper.

apadventure.node.has.helpbase=This node checks how many of a certain item the player has by its name.
apadventure.node.has.helpdontuse=You should not be using this node in most cases, as it's likely to break on future updates as item names may change in the future.

apadventure.node.schmove.skill=Skill Rating
apadventure.node.schmove.helpskill=The Skill Rating option lets you set a number between 0 and 10. This Skill Rating is intended to be oriented around the way Momentum Mod handles its tier ratings, although unlike Momentum Mod, decimal points may be used for more granularity.
apadventure.node.schmove.helpzero=Note that if "Skill Rating" is set to zero, the generator will still only consider this rule accessible if the player has set their logic option to a number higher than zero, as there would be no way to disable "schmovement logic" otherwise.

apadventure.node.bhop.helpbase=This node checks whether the player has the ability to bunnyhop and what their "bhop_logic" option is set to.
apadventure.node.bhop.helppreprocess=If the player set "bhop" to "never" or the skill rating in this node is set to a number higher than or equal to what their "bhop_logic" option is set to, the generator will automatically preprocess this node out. If this results in an access rule being impossible to fulfill, whatever location, connection, entrance or exit this rule was assigned to will not be created or connected. You can utilize this behaviour to prevent bhop maps from being added to a run automatically by putting this rule on your entrances or add extra locations for people who know how to bunnyhop.
apadventure.node.bhop.helptracker=If whatever this rule was placed on is still accessible by other means and the player has the ability to bunnyhop the tracker will display any rules with a skill rating higher than the players "bhop_logic" value as being accessible out of logic (yellow instead of red).

apadventure.node.surf.helpbase=This node checks what the players "surf_logic" option is set to.
apadventure.node.surf.helppreprocess=If the skill rating in this node is set to a number higher than or equal to what the players "surf_logic" option is set to, the generator will automatically preprocess this node out. If this results in an access rule being impossible to fulfill, whatever location, connection, entrance or exit this rule was assigned to will not be created or connected. You can utilize this behaviour to prevent surf maps from being added to a run automatically by putting this rule on your entrances or add extra locations for people who know how to surf.
apadventure.node.surf.helptracker=If whatever this rule was placed on is still accessible by other means the tracker will display any rules with a low enough skill rating as being accessible out of logic (yellow instead of red).

apadventure.node.capab.override=Override Regional Conditions
apadventure.node.capab.helpbase=The Capability node is one of the main ways to check for items in apAdventure. Items in apAdventure may have "Capabilities" assigned to them, which the generator checks for instead of looking for specific items. This allows custom items to fulfill logic rules without needing to be supported explicitly.
apadventure.node.capab.helpideflink=There is currently no way to view what items provide what conditions ingame, so you'll have to figure this out by looking at the item definitions for now.
apadventure.node.capab.helpimplied=Some Capabilities will also automatically fulfill other Capabilities when set on an item. You can find out what those are here.
apadventure.node.capab.helpcond=Some items may only provide certain Capabilities if certain conditions are fulfilled. For example, the Half-Life 2 Shotgun will only provide the Capability "StrongShortRange" under the Condition "Ammo_Buckshot".
apadventure.node.capab.helpmulti=If you set this rule to check for multiple capabilities, it will check if all of those capabilities exist on the same item. If you just want to check if a player has certain capabilities, but don't care if they're on the same item or not, you should create multiple of these nodes and put them inside "and" or "or" nodes.
apadventure.node.capab.helpoverride=Normally, this rule looks for the currently fulfilled Conditions by looking at the region it's currently in, but you can override these Conditions by checking "Override" and setting some custom conditions for this rule in the form below.
apadventure.node.capab.helpsave=Note that due to the way nodes are saved, if you set some Conditions in the Condition Form but do not enable the Override Check, those Conditions will not be saved and will disappear if you start editing another node.

